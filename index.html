<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EchoChain</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header id="topbar">
    <h1 id="logo">EchoChain</h1>
    <div id="language">
      <label><input type="radio" name="personality" value="genz" checked> Gen Z</label>
      <label><input type="radio" name="personality" value="millennial"> Millennial</label>
      <label><input type="radio" name="personality" value="boomer"> Boomer</label>
    </div>
  </header>

  <main id="app">
    <p id="instructions">Hit this baddie 🚀</p>
    <div id="controls">
      <label>Depth <input type="range" id="depth" min="1" max="5" value="3"><span id="depth-label">3</span></label>
    </div>
    <button id="generate">Generate</button>
    <div id="thought" class="serene"></div>
    <section id="history-container">
      <h3>Recent Echoes</h3>
      <div id="history"></div>
    </section>
  </main>

  <audio id="ping" src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=" preload="auto"></audio>
  <script src="script.js"></script>
</body>
</html>
