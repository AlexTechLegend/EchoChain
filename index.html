<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EchoChain</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <h1 id="logo">EchoChain</h1>
    <div id="controls">
      <label>Depth: <input type="range" id="depth" min="1" max="5" value="3"></label>
      <div id="personalities">
        <label><input type="radio" name="personality" value="genz" checked> Gen Z</label>
        <label><input type="radio" name="personality" value="millennial"> Millennial</label>
        <label><input type="radio" name="personality" value="boomer"> Boomer</label>
      </div>
    </div>
    <button id="generate">Generate Thought</button>
    <div id="thought" class="serene"></div>
  </div>

<script src="script.js"></script>
</body>
</html>
